<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דשבורד מרוץ</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Rubik', sans-serif;
    background: #050510;
    color: #fff;
    min-height: 100vh;
    overflow: hidden;
    padding: 1.5rem;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
  }

  .title { font-size: 1.8rem; font-weight: 900; color: #FFD700; }
  .race-code { color: #555; font-size: 0.9rem; }
  .status-badge {
    padding: 0.4rem 1.2rem;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 700;
  }
  .status-waiting { background: #2a2a50; color: #888; }
  .status-running { background: rgba(56,239,125,0.2); color: #38ef7d; }
  .status-finished { background: rgba(255,215,0,0.2); color: #FFD700; }

  /* RACE TRACK */
  .track-container {
    position: relative;
    background: #0a0a1a;
    border-radius: 20px;
    padding: 1rem 2rem;
    margin-bottom: 1.5rem;
    border: 1px solid #1a1a35;
    overflow: hidden;
  }

  /* Road texture */
  .track-container::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(255,255,255,0.02) 60px, rgba(255,255,255,0.02) 61px);
    pointer-events: none;
  }

  .lane {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.6rem 0;
    position: relative;
  }

  .lane + .lane {
    border-top: 1px solid #111130;
  }

  .lane-name {
    width: 100px;
    font-size: 0.85rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
    text-align: right;
  }

  .lane-track {
    flex: 1;
    height: 40px;
    background: #080818;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    border: 1px solid #1a1a30;
  }

  /* Dashed center line */
  .lane-track::before {
    content: '';
    position: absolute;
    top: 50%; left: 0; right: 0;
    border-top: 1px dashed #1a1a40;
  }

  .lane-vehicle {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.5rem;
    transition: left 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    filter: drop-shadow(0 0 8px rgba(255,215,0,0.4));
    white-space: nowrap;
    left: 2px;
    z-index: 2;
  }

  .lane-trail {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    border-radius: 20px;
    opacity: 0.3;
    transition: width 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    width: 0%;
  }

  .lane-score {
    width: 60px;
    text-align: left;
    color: #555;
    font-size: 0.8rem;
    flex-shrink: 0;
  }

  .finish-flag {
    position: absolute;
    left: 2rem;
    top: 0; bottom: 0;
    display: flex;
    align-items: center;
    font-size: 1.2rem;
    color: rgba(255,255,255,0.3);
    pointer-events: none;
  }

  /* Countdown */
  #countdown {
    position: fixed;
    inset: 0;
    background: rgba(5,5,16,0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    font-size: 15rem;
    font-weight: 900;
    color: #FFD700;
    animation: none;
  }

  /* Events ticker */
  .ticker {
    background: #0a0a1a;
    border-radius: 12px;
    padding: 0.8rem 1.2rem;
    font-size: 0.9rem;
    color: #888;
    max-height: 80px;
    overflow: hidden;
    border: 1px solid #1a1a35;
    margin-bottom: 1.5rem;
  }

  .ticker-item {
    animation: tickerIn 0.4s ease;
    color: #ccc;
    padding: 0.1rem 0;
  }
  @keyframes tickerIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:none} }

  /* Leaderboard */
  .leaderboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.8rem;
  }

  .lb-card {
    background: #0a0a1a;
    border: 1px solid #1a1a35;
    border-radius: 12px;
    padding: 0.8rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    transition: border-color 0.3s;
  }
  .lb-card.leader { border-color: #FFD700; }

  .lb-rank { font-size: 1.2rem; font-weight: 900; color: #555; width: 24px; }
  .lb-rank.gold { color: #FFD700; }
  .lb-rank.silver { color: #aaa; }
  .lb-rank.bronze { color: #CD7F32; }
  .lb-vehicle { font-size: 1.4rem; }
  .lb-info { flex: 1; overflow: hidden; }
  .lb-name { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-pos { font-size: 0.75rem; color: #555; }

  /* Win screen */
  #win-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,5,16,0.97);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    z-index: 100;
  }
  #win-screen h1 { font-size: 4rem; font-weight: 900; color: #FFD700; margin: 1rem 0; }
  #win-screen .winner-vehicle { font-size: 8rem; animation: winBounce 0.6s ease; }
  @keyframes winBounce { 0%{transform:scale(0) rotate(-180deg)} 80%{transform:scale(1.2) rotate(10deg)} 100%{transform:scale(1) rotate(0)} }

  .section-title { font-size: 0.75rem; font-weight: 700; color: #444; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.6rem; }
</style>
</head>
<body>

<div id="countdown" style="display:none;"></div>

<div class="top-bar">
  <div>
    <div class="title">🏁 מרוץ חשבון</div>
    <div class="race-code" id="race-code-label"></div>
  </div>
  <div class="status-badge status-waiting" id="status-badge">⏳ ממתין לשחקנים</div>
</div>

<div class="section-title">מסלול המרוץ</div>
<div class="track-container" id="track">
  <div style="color:#333; text-align:center; padding:2rem;">ממתין לשחקנים להצטרף...</div>
  <div class="finish-flag">🏁</div>
</div>

<div class="section-title">אירועים</div>
<div class="ticker" id="ticker">
  <div class="ticker-item">ממתין להתחלת המרוץ...</div>
</div>

<div class="section-title">דירוג נוכחי</div>
<div class="leaderboard" id="leaderboard"></div>

<!-- Win screen -->
<div id="win-screen">
  <div class="winner-vehicle" id="win-vehicle"></div>
  <h1 id="win-name"></h1>
  <p style="color:#888; font-size:1.2rem;">הגיע ראשון לקו הסיום!</p>
  <div id="win-standings" style="margin-top:2rem; direction:rtl;"></div>
</div>

<script>
const code = new URLSearchParams(location.search).get('code');
let players = {};

if (!code) {
  document.body.innerHTML = '<div style="padding:3rem;text-align:center;color:#FF6B6B;font-size:1.5rem;">נא לפתוח דף זה מממשק המורה עם קוד מרוץ תקין.</div>';
} else {
  document.getElementById('race-code-label').textContent = `קוד: ${code}`;
  connectSSE();
}

function connectSSE() {
  const es = new EventSource(`/api/race/${code}/events`);

  es.addEventListener('init', e => {
    const data = JSON.parse(e.data);
    data.players.forEach(p => players[p.id] = p);
    renderTrack();
    renderLeaderboard();
    if (data.status === 'running') setBadge('running');
  });

  es.addEventListener('playerJoined', e => {
    const data = JSON.parse(e.data);
    data.players.forEach(p => players[p.id] = p);
    renderTrack();
    renderLeaderboard();
    addTicker(`${data.players[data.players.length-1]?.vehicle} שחקן חדש הצטרף!`);
  });

  es.addEventListener('raceStarted', e => {
    setBadge('running');
    addTicker('🚦 המרוץ התחיל!');
    showCountdown();
  });

  es.addEventListener('positionUpdate', e => {
    const data = JSON.parse(e.data);
    if (players[data.playerId]) {
      players[data.playerId].position = data.position;
    }
    data.players.forEach(p => { if (players[p.id]) { players[p.id] = {...players[p.id], ...p}; } });
    updateVehicle(data.playerId, data.position);
    renderLeaderboard();
  });

  es.addEventListener('luckEvent', e => {
    const data = JSON.parse(e.data);
    const p = players[data.playerId];
    if (p) addTicker(`${p.vehicle} ${p.name}: ${data.event.label}`);
  });

  es.addEventListener('highwayResult', e => {
    const data = JSON.parse(e.data);
    const p = players[data.playerId];
    if (!p) return;
    if (data.success) addTicker(`🛣️ ${p.name} עבר את האוטוסטרדה! +${data.bonus} נקודות 🎉`);
    else addTicker(`💥 ${p.name} נכשל באוטוסטרדה! ${data.penalty} נקודות`);
  });

  es.addEventListener('choseDirt', e => {
    const data = JSON.parse(e.data);
    const p = players[data.playerId];
    if (p) addTicker(`🌿 ${p.name} בחר בדרך עפר`);
  });

  es.addEventListener('raceFinished', e => {
    const data = JSON.parse(e.data);
    setBadge('finished');
    addTicker(`🏆 ${data.winner} ניצח במרוץ!`);
    showWinScreen(data);
  });
}

function renderTrack() {
  const track = document.getElementById('track');
  const playerList = Object.values(players);
  if (!playerList.length) return;

  track.innerHTML = `<div class="finish-flag">🏁</div>` +
    playerList.map(p => `
    <div class="lane" id="lane-${p.id}">
      <div class="lane-name" style="color:${p.color}">${p.name}</div>
      <div class="lane-track">
        <div class="lane-trail" id="trail-${p.id}" style="background:${p.color}"></div>
        <div class="lane-vehicle" id="vehicle-${p.id}" style="left:2px">${p.vehicle}</div>
      </div>
      <div class="lane-score" id="score-${p.id}">0</div>
    </div>
  `).join('');
}

function updateVehicle(playerId, position) {
  const pct = Math.min(98, (position / 1000) * 96);
  const vehicle = document.getElementById(`vehicle-${playerId}`);
  const trail = document.getElementById(`trail-${playerId}`);
  const score = document.getElementById(`score-${playerId}`);
  if (vehicle) vehicle.style.left = pct + '%';
  if (trail) trail.style.width = pct + '%';
  if (score) score.textContent = position;
}

function renderLeaderboard() {
  const sorted = Object.values(players).sort((a,b) => b.position - a.position);
  const rankColors = ['gold','silver','bronze'];
  document.getElementById('leaderboard').innerHTML = sorted.map((p, i) => `
    <div class="lb-card ${i===0 ? 'leader' : ''}">
      <div class="lb-rank ${rankColors[i] || ''}">${i+1}</div>
      <div class="lb-vehicle">${p.vehicle}</div>
      <div class="lb-info">
        <div class="lb-name" style="color:${p.color}">${p.name}</div>
        <div class="lb-pos">${p.position} / 1000</div>
      </div>
    </div>
  `).join('');
}

function addTicker(msg) {
  const ticker = document.getElementById('ticker');
  const el = document.createElement('div');
  el.className = 'ticker-item';
  el.textContent = msg;
  ticker.prepend(el);
  while (ticker.children.length > 3) ticker.removeChild(ticker.lastChild);
}

function setBadge(status) {
  const el = document.getElementById('status-badge');
  el.className = 'status-badge status-' + status;
  el.textContent = { waiting: '⏳ ממתין לשחקנים', running: '🟢 מרוץ פעיל', finished: '🏁 הסתיים' }[status];
}

function showCountdown() {
  const el = document.getElementById('countdown');
  el.style.display = 'flex';
  let n = 3;
  el.textContent = n;
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      el.textContent = 'GO! 🏁';
      setTimeout(() => { el.style.display = 'none'; }, 800);
    } else {
      el.textContent = n;
    }
  }, 1000);
}

function showWinScreen(data) {
  setTimeout(() => {
    const p = players[data.winnerId];
    document.getElementById('win-vehicle').textContent = p?.vehicle || '🏆';
    document.getElementById('win-name').textContent = `🏆 ${data.winner}`;
    if (data.finalStandings) {
      document.getElementById('win-standings').innerHTML =
        data.finalStandings.map(s => `
          <div style="display:flex;align-items:center;gap:1rem;padding:0.5rem 1rem;background:#0a0a1a;border-radius:8px;margin-bottom:0.5rem;max-width:400px;margin:0 auto 0.5rem;">
            <span style="font-size:1.2rem;font-weight:900;color:#FFD700;width:30px">${s.rank}</span>
            <span style="font-size:1.2rem">${s.vehicle}</span>
            <span style="flex:1">${s.name}</span>
            <span style="color:#555;font-size:0.85rem">${s.position}/1000</span>
          </div>
        `).join('');
    }
    document.getElementById('win-screen').style.display = 'flex';
  }, 2000);
}
</script>
</body>
</html>
